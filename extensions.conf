[general]
static=yes
writeprotect=no

[globals]

[from-clients]
; Client calls land here. TECH_PREFIX set via endpoint set_var.
; Use __ prefix to inherit variables to the B channel (outbound leg).
;
; Post-Dial hangup cause mapping:
;   AMD MACHINE  -> per-client, clients.amd_reject: SIP 400-699, default 603
;   CHANUNAVAIL  -> cause 38 (SIP 503) - network/carrier issue
;   CONGESTION   -> cause 38 (SIP 503) - network/carrier issue
;   BUSY         -> cause 17 (SIP 486) - remote busy
;   NOANSWER     -> cause 19 (SIP 480) - no answer
;   Normal end   -> natural hangup cause from remote
;
exten => _X.,1,NoOp(Call from ${CHANNEL(endpoint)} to ${EXTEN} prefix ${TECH_PREFIX})
 same => n,Set(__VID=${CALLERID(name)})
 same => n,Set(__ANI=${CALLERID(num)})
 same => n,Set(__DIALED=${EXTEN})
 ; Customer whitelisted IP, read from the PJSIP realtime config (identify match)
 ; and inherited (__) to the amd-check subroutine on the outbound leg.
 same => n,Set(__CLIENT_IP=${REALTIME_FIELD(ps_endpoint_id_ips,id,${CHANNEL(endpoint)},match)})
 same => n,Goto(gw-route,s,1)

exten => _+X.,1,NoOp(Call from ${CHANNEL(endpoint)} to ${EXTEN} prefix ${TECH_PREFIX})
 same => n,Set(__VID=${CALLERID(name)})
 same => n,Set(__ANI=${CALLERID(num)})
 same => n,Set(__DIALED=${EXTEN})
 same => n,Set(__CLIENT_IP=${REALTIME_FIELD(ps_endpoint_id_ips,id,${CHANNEL(endpoint)},match)})
 same => n,Goto(gw-route,s,1)

; ── Per-client gateway routing ───────────────────────────────────────────────
; Both client extensions Goto here with the number preserved in ${DIALED}.
; gateway_select.py sets GW_COUNT + GW_1..N for this client's assigned gateways.
;   weighted mode -> GW_COUNT=1 (one weighted pick)
;   failover mode -> GW_COUNT=N (try in priority order on CHANUNAVAIL/CONGESTION)
;   no gateways   -> GW_COUNT=0 -> fall back to voip-switch (existing behavior)
[gw-route]
exten => s,1,Set(GW_COUNT=0)
 ; Fallback until the AGI reports this client's choice (clients.amd_reject).
 same => n,Set(__AMD_REJECT=603)
 same => n,AGI(gateway_select.py,${CLIENT_IP})
 same => n,ExecIf($["${GW_COUNT}"="0"|"${GW_COUNT}"=""]?Goto(viaswitch))
 same => n,Set(IDX=1)
 same => n(gwloop),Set(CURGW=${GW_${IDX}})
 same => n,Dial(PJSIP/${TECH_PREFIX}${DIALED}@${CURGW},60,U(amd-check,s,1))
 ; amd-check returns GOSUB_RESULT=CONTINUE on MACHINE, so execution lands here.
 same => n,GotoIf($["${AMD_RESULT}"="MACHINE"]?amdreject)
 same => n,Set(IDX=$[${IDX}+1])
 same => n,GotoIf($[${IDX}<=${GW_COUNT} & ("${DIALSTATUS}"="CHANUNAVAIL"|"${DIALSTATUS}"="CONGESTION")]?gwloop)
 same => n,Hangup()
 same => n(viaswitch),Dial(PJSIP/${TECH_PREFIX}${DIALED}@voip-switch,60,U(amd-check,s,1))
 same => n,GotoIf($["${AMD_RESULT}"="MACHINE"]?amdreject)
 same => n,Hangup()

 ; ── AMD rejection ──────────────────────────────────────────────────────────
 ; PJSIPHangup(<code>) ends the still-unanswered client call with that exact
 ; SIP status, 400-699 (Asterisk 18.21 / 20.6 / 21.1 or later). The client
 ; leg is not answered yet: amd-check runs in Dial U() before the bridge.
 ; Hangup(16) is only reached if PJSIPHangup is refused; chan_pjsip then
 ; sends 603 Decline (cause 16 is not in hangup_cause2sip()).
 same => n(amdreject),NoOp(AMD MACHINE - rejecting with SIP ${AMD_REJECT})
 same => n,PJSIPHangup(${AMD_REJECT})
 same => n,Hangup(16)

[amd-check]
; Subroutine runs on the CALLED channel after answer, before bridge.
; VID, ANI, DIALED inherited from A channel via __ prefix.
; Uses AMDY AI AMD first (AMD_WS native module, app_amd_ws.so; settings in
; /etc/asterisk/amd_ws.conf), falls back to built-in AMD on NOTSURE.
; p() sends the dialed number, k() the country code; both skip the ViciDial DB
; lookup. amd.py (EAGI) is still installed as a fallback: swap the two lines.
; On MACHINE: flags the master channel and returns CONTINUE, so the caller's
; dialplan ([gw-route] label amdreject) hangs up with the client's reject cause.
exten => s,1,NoOp(Starting AMDY AI AMD detection)
 same => n,NoOp(VID=${VID} ANI=${ANI} DIALED=${DIALED})
 same => n,Set(CALLERID(name)=${VID})
 same => n,Set(CALLERID(num)=${ANI})
 ;same => n,EAGI(/var/lib/asterisk/agi-bin/amd.py)
 same => n,AMD_WS(api.amdy.io,2700,${CALLERID(name)},10000,,p(${DIALED})k(1))
 same => n,NoOp(AMDY Result: ${AMDSTATUS} Cause: ${AMDCAUSE})
 same => n,GotoIf($["${AMDSTATUS}" = "MACHINE"]?machine:check_human)
 same => n(check_human),GotoIf($["${AMDSTATUS}" = "HUMAN"]?human:fallback)
 same => n(fallback),NoOp(AMDY unavailable, falling back to built-in AMD)
 same => n,AMD()
 same => n,NoOp(Built-in AMD: ${AMDSTATUS} Cause: ${AMDCAUSE})
 same => n,GotoIf($["${AMDSTATUS}" = "MACHINE"]?machine:human)
 same => n(machine),NoOp(MACHINE detected - reject status for this client: ${AMD_REJECT})
 same => n,Set(MASTER_CHANNEL(AMD_RESULT)=MACHINE)
 same => n,Set(MASTER_CHANNEL(AMD_CAUSE)=${AMDCAUSE})
 same => n,Set(MASTER_CHANNEL(AMD_STATS)=${AMDSTATS})
 ; CONTINUE hangs up this called leg and returns the caller to the priority
 ; after Dial(), where the cause is chosen. ABORT would kill both legs here
 ; and leave the status code to chance.
 same => n,Set(GOSUB_RESULT=CONTINUE)
 same => n,Return()
 same => n(human),Set(MASTER_CHANNEL(AMD_RESULT)=HUMAN)
 same => n,Set(MASTER_CHANNEL(AMD_CAUSE)=${AMDCAUSE})
 same => n,Set(MASTER_CHANNEL(AMD_STATS)=${AMDSTATS})
 same => n,Return()

; AGI routing test harness (places no calls)
#include "extensions_gwtest.conf"
