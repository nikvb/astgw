; ── AGI gateway-routing test harness ────────────────────────────────────────
; Runs gateway_select.py exactly the way a real call does, but places no call:
; nothing is dialled, the channel hangs up once the decision has been logged.
;
;   asterisk -rx 'dialplan set global TESTIP 176.9.119.54'
;   asterisk -rx 'channel originate Local/s@gw-route-test application Wait 1'
;   grep GWTEST /var/log/asterisk/messages.log | tail -3
;
; Included from extensions.conf. Never referenced by client traffic.
[gw-route-test]
exten => s,1,Log(NOTICE,GWTEST start ip=${TESTIP})
 same => n,Set(CLIENT_IP=${TESTIP})
 same => n,Set(GW_MODE=unset)
 same => n,Set(GW_COUNT=0)
 same => n,Set(GW_1=none)
 same => n,Set(GW_2=none)
 same => n,AGI(gateway_select.py,${CLIENT_IP})
 same => n,Log(NOTICE,GWTEST result ip=${CLIENT_IP} mode=${GW_MODE} count=${GW_COUNT} gw1=${GW_1} gw2=${GW_2})
 same => n,GotoIf($["${GW_COUNT}"="0"]?fallback)
 same => n,Log(NOTICE,GWTEST would dial PJSIP/<prefix><number>@${GW_1})
 same => n,Hangup()
 same => n(fallback),Log(NOTICE,GWTEST no gateway returned - would fall back to voip-switch)
 same => n,Hangup()
