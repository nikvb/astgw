;
; AstGW Asterisk logging
;
; full.log carries everything useful for diagnosing call routing (including the
; AGI's own "AstGW:" verbose lines) but NOT debug — debug at level 10 grew
; full.log to 58 GB. Turn it on only while troubleshooting:
;     asterisk -rx 'core set debug 3'      (and 'core set debug 0' after)
; and add ,debug to full.log below if it must reach the file.
;
; Rotation is handled by /etc/logrotate.d/asterisk (size + daily, 14 kept).

[general]
; ISO-style timestamps with milliseconds: 2026-09-08 01:34:12.345
dateformat = %F %T.%3q

[logfiles]
console => notice,warning,error
messages.log => notice,warning,error
full.log => notice,warning,error,verbose(3),dtmf,fax
